apiVersion: apps/v1
kind: Deployment
metadata:
  name: railbooker
  namespace: railbooker
  labels:
    app: railbooker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: railbooker
  template:
    metadata:
      labels:
        app: railbooker
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: tier
                    operator: In
                    values:
                      - app

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: railbooker

      containers:
        - name: railbooker
          image: railbooker:v1.0.0
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080
              protocol: TCP

          envFrom:
            - configMapRef:
                name: railbooker-config

          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: railbooker-db
                  key: DB_PASSWORD

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health.php
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
